name: Platform Alpha 1
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      full:
        description: Run the full release gate
        type: boolean
        default: true
      base_sha:
        description: Optional ancestor for an affected-path demonstration
        type: string
        default: ''
      cache_probe:
        description: Repeat the identical image build and verify cached bytes
        type: boolean
        default: false
  pull_request:
  push:
    branches: [main, agent/platform-alpha1]
permissions:
  contents: read
jobs:
  scope:
    runs-on: ubuntu-24.04
    outputs:
      full: ${{ steps.plan.outputs['full'] }}
      plan: ${{ steps.plan.outputs['plan'] }}
      cache_probe: ${{ steps.plan.outputs['cache_probe'] }}
      platform: ${{ steps.plan.outputs['platform'] }}
      frontend: ${{ steps.plan.outputs['frontend'] }}
      workbench-e2e: ${{ steps.plan.outputs['workbench-e2e'] }}
      ha-bridge: ${{ steps.plan.outputs['ha-bridge'] }}
      images: ${{ steps.plan.outputs['images'] }}
      herd-assets: ${{ steps.plan.outputs['herd-assets'] }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: plan
        run: python dev/ci_scope.py --event "$GITHUB_EVENT_NAME" --head "$GITHUB_SHA"
  source-proof:
    needs: scope
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Record the actual tested merge tree
        env:
          CI_PLAN: ${{ needs.scope.outputs.plan }}
        run: |
          python -c 'import json,os,subprocess; print(json.dumps(dict(revision=os.environ["GITHUB_SHA"],tree=subprocess.check_output(["git","rev-parse","HEAD^{tree}"],text=True).strip(),run_id=os.environ["GITHUB_RUN_ID"],run_attempt=os.environ["GITHUB_RUN_ATTEMPT"],scope=json.loads(os.environ["CI_PLAN"]))))' > ci-source.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-source
          path: ci-source.json
          retention-days: 7
  herd-assets:
    needs: scope
    if: needs.scope.outputs['herd-assets'] == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: levtos/control
          ref: 70b6e83b26a930632c7b2430fb6d5b955ec63158
          path: herd-originals
          sparse-checkout: assets/herde
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: '3.14.5'
      - run: uv sync --frozen
      - run: uv run python dev/verify_herd_rebuild.py herd-originals/assets/herde
  platform:
    needs: scope
    if: needs.scope.outputs['platform'] == 'true'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_USER: core_contracts_test
          POSTGRES_PASSWORD: ephemeral-test-only
          POSTGRES_DB: core_contracts_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U core_contracts_test" --health-interval 2s --health-retries 20
    env:
      TEST_DATABASE_DSN: postgresql://core_contracts_test:ephemeral-test-only@localhost:5432/core_contracts_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: '3.14.5'
      - run: uv sync --frozen
      - run: uv run python dev/verify_postrelease.py --mode ci
      - name: Require public images for the offered store version
        run: uv run python dev/store_offer.py
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy --strict src client/core_contracts_client
      - run: uv export --frozen --no-dev --no-emit-project --format requirements-txt > /tmp/platform-requirements.txt
      - run: uvx pip-audit==2.9.0 --strict --no-deps --disable-pip -r /tmp/platform-requirements.txt
      - run: uv run pytest -q
        env:
          PG_TEST_CONTAINER_ID: ${{ job.services.postgres.id }}
          TEST_MQTT_DOCKER: '1'
      - run: uv run python dev/resource_probe.py
      - run: uv run python dev/review_probe.py
      - run: uv run python dev/alpha8_scale_probe.py
      - run: uv build --wheel
      - run: uv build --wheel --project client
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-wheels
          path: |
            dist/*.whl
            client/dist/*.whl
            dist/alpha4-review-performance.json
            dist/alpha8-scale.json
  frontend:
    needs: scope
    if: needs.scope.outputs['frontend'] == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run scan:i18n
      - run: npm run test:i18n-lint
      - run: npm test
      - run: npm run build
      - run: npm run verify:dist
      - name: Production dependency audit (blocking)
        run: npm audit --omit=dev --audit-level=high
      - name: Development dependency audit (warning)
        continue-on-error: true
        run: npm audit --audit-level=high
  workbench-e2e:
    needs: scope
    if: needs.scope.outputs['workbench-e2e'] == 'true'
    # The Workbench against the REAL API and engine of a throw-away, in-memory instance
    # (dev/workbench_demo.py): no Home Assistant, no PostgreSQL, nothing persistent.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: '3.14.5'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --frozen
      - run: npm ci
        working-directory: frontend
      - name: Workbench end-to-end
        run: |
          port="${WUSCHEL_E2E_PORT:-8123}"
          .venv/bin/python dev/workbench_demo.py --feed --interval 1 --port "$port" > /tmp/workbench-demo.log 2>&1 &
          engine_pid=$!
          cleanup() {
            kill "$engine_pid" 2>/dev/null || true
            wait "$engine_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          ready=false
          for attempt in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:$port/api/v1/registry/drafts"; then
              ready=true
              break
            fi
            kill -0 "$engine_pid" 2>/dev/null || break
            sleep 1
          done
          test "$ready" = true
          WUSCHEL_E2E_URL="http://127.0.0.1:$port" npm --prefix frontend run test:e2e
      - name: Engine log
        if: failure()
        run: tail -n 80 /tmp/workbench-demo.log
  ha-bridge:
    needs: scope
    if: needs.scope.outputs['ha-bridge'] == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: '3.14.5'
      - run: uv venv .ha-venv
      - run: uv pip install --python .ha-venv/bin/python homeassistant==2026.10.0 asyncpg==0.32.0 pydantic==2.12.5 pytest==9.0.2 pytest-asyncio==1.3.0
      - run: .ha-venv/bin/python -m pytest tests/test_bridge_kernel.py -q
  images:
    needs: scope
    if: needs.scope.outputs['images'] == 'true'
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: '3.14.5'
      - run: uv sync --frozen
      - name: Supervisor image metadata
        id: package
        run: uv run python dev/image_package.py metadata --arch "${{ matrix.arch }}" --revision "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: wuschel/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            BUILD_VERSION=${{ steps.package.outputs.version }}
            BUILD_ARCH=${{ matrix.arch }}
            SOURCE_REVISION=${{ github.sha }}
            SOURCE_DATE_EPOCH=0
          cache-from: type=gha,scope=wuschel-amd64
          cache-to: type=gha,scope=wuschel-amd64,mode=max
          push: false
          outputs: type=docker,dest=/tmp/core-contracts-${{ matrix.arch }}.tar
          tags: core-contracts:smoke
      - name: Repeat identical build from the stage cache
        if: needs.scope.outputs.cache_probe == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: wuschel/Dockerfile
          platforms: linux/amd64
          build-args: |
            BUILD_VERSION=${{ steps.package.outputs.version }}
            BUILD_ARCH=amd64
            SOURCE_REVISION=${{ github.sha }}
            SOURCE_DATE_EPOCH=0
          cache-from: type=gha,scope=wuschel-amd64
          cache-to: type=gha,scope=wuschel-amd64,mode=max
          push: false
          outputs: type=docker,dest=/tmp/core-contracts-cache-probe.tar
          tags: core-contracts:cache-probe
      - name: Require identical image bytes after cache reuse
        if: needs.scope.outputs.cache_probe == 'true'
        run: |
          docker load -i /tmp/core-contracts-amd64.tar
          docker load -i /tmp/core-contracts-cache-probe.tar
          test "$(docker image inspect core-contracts:smoke --format '{{.Id}}')" = "$(docker image inspect core-contracts:cache-probe --format '{{.Id}}')"
      - name: Verify packaged metadata and content
        run: |
          docker load -i /tmp/core-contracts-${{ matrix.arch }}.tar
          uv run python dev/image_package.py check --arch "${{ matrix.arch }}" --revision "$GITHUB_SHA"
      - name: Isolated container lifecycle smoke
        if: matrix.arch == 'amd64'
        run: |
          uv run python dev/container_smoke.py core-contracts:smoke
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-${{ matrix.arch }}
          path: /tmp/core-contracts-${{ matrix.arch }}.tar
          retention-days: 3

  ci-result:
    name: CI result
    if: always()
    needs: [scope, source-proof, herd-assets, platform, frontend, workbench-e2e, ha-bridge, images]
    runs-on: ubuntu-24.04
    steps:
      - name: Require all selected jobs to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python -c 'import json,os; jobs=json.loads(os.environ["RESULTS"]); assert jobs["scope"]["result"]=="success"; assert all(job["result"] in {"success","skipped"} for job in jobs.values())'
